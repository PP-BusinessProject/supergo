publish_to: none
name: supergo
description: Optimization App Framework that allows creating domain-specific AI optimization dashboards in hours instead of weeks.
version: 0.0.1+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Analytics / Logging
  app_tracking_transparency: ^2.0.6+1
  sentry: &sentry_version ^9.20.0
  sentry_dio: *sentry_version
  sentry_drift: *sentry_version
  sentry_flutter: *sentry_version
  sentry_supabase: *sentry_version
  talker: &talker_version ^5.1.17
  talker_dio_logger: *talker_version
  talker_riverpod_logger: *talker_version

  # UI / UX
  flutter_hooks: ^0.21.3+1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  go_router: ^17.2.3
  hooks_riverpod: ^3.3.2-dev.2
  lottie: ^3.3.3
  lottie_native: ^0.2.0
  mix:
    git:
      url: https://github.com/btwld/mix
      path: packages/mix
  naked_ui: ^0.2.0-beta.7
  permission_handler: ^12.0.1
  portal_labs: ^0.27.1
  rive: ^0.14.7
  simple_shadow: ^0.3.1
  slang_flutter: &slang_version ^4.14.0

  # Database / Authentication
  dart_mappable: &dart_mappable_version ^4.8.0
  drift: &drift_version ^2.33.0
  drift_flutter: ^0.3.0
  google_sign_in: ^7.2.0
  postgrest: ^2.7.0
  realtime_client: ^2.7.3
  sign_in_with_apple: ^8.0.0
  storage_client: ^2.5.2
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.5.5

  # HTTP Client
  dio_compatibility_layer: ^0.1.1
  dio: ^5.9.2
  http: ^1.6.0
  resilify: ^1.1.0
  retrofit: ^4.9.2
  rhttp: ^0.17.0
  web_socket_channel: ^3.0.3

  # Other
  ack: ^1.0.0-beta.11
  collection: ^1.19.1
  crypto: ^3.0.7
  flutter_multi_formatter: ^2.13.10
  flutter_native_splash: ^2.4.7
  intl: ^0.20.2
  mix_annotations: ^2.0.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.15.0
  custom_lint: &custom_lint_version ^0.8.1
  mix_lint: ^1.7.0
  riverpod_lint: ^3.1.4-dev.3
  source_gen: ^4.2.3

  # Tools
  flutter_launcher_icons: ^0.14.4

  # Tests
  convenient_test: ^1.6.2
  patrol: ^4.5.0
  patrol_finders: ^3.2.0
  patrol_log: ^0.8.0

  # build.yaml
  dart_mappable_builder: *dart_mappable_version
  drift_dev: *drift_version
  enven: ^1.3.0
  flutter_gen_runner: ^5.14.1
  go_router_builder: ^4.3.0
  mix_generator: ^2.0.1
  retrofit_generator: ^10.2.6
  riverpod_generator: ^4.0.4-dev.3
  slang_build_runner: *slang_version


dependency_overrides:
  analyzer: ^12.1.0
  analyzer_plugin: ^0.14.8
  custom_lint: *custom_lint_version
  custom_lint_core: *custom_lint_version
  meta: ^1.18.2
  web: ^1.0.0


flutter:
  uses-material-design: true

  assets:
    - source/assets/
    - source/assets/onboarding/
    - source/assets/onboarding/00_splash/
    - source/assets/onboarding/01_welcome/

  fonts:
    - family: Gotham Pro
      fonts:
        - asset: source/fonts/Gotham Pro/Gotham-Pro-Bold.ttf
          weight: 700
        - asset: source/fonts/Gotham Pro/Gotham-Pro-Black.ttf
          weight: 900

    # Only for Android
    - family: .SF Pro Text
      fonts:
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-SemiBold.otf
          weight: 600
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Bold.otf
          weight: 700
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Heavy.otf
          weight: 900

flutter_launcher_icons:
  android: launcher_icons
  ios: true
  remove_alpha_ios: true
  image_path: source/icon.png

flutter_native_splash:
  color: "#ffffff"
  background_image: source/assets/splash.png
  # image: source/assets/logo.png
  fullscreen: true

flutter_gen:
  output: lib/generated/
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true
